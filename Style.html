<style>
:root {
  --blue: #2c51e8;
  --green: #20b58a;
  --ink: #1a2540;
  --muted: #8a92a5;
  --line: #edf0f5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f7f9fc;
  color: var(--ink);
  font: 14px 'DM Sans', Arial, sans-serif;
}

button, input, select { font: inherit; }

button {
  cursor: pointer;
  transition: .18s;
}

button:hover { filter: brightness(.95); }

button:focus-visible,
a:focus-visible {
  outline: 3px solid #8bafff;
  outline-offset: 3px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

aside {
  width: 232px;
  position: fixed;
  inset: 0 auto 0 0;
  background: white;
  border-right: 1px solid var(--line);
  padding: 38px 23px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--ink);
  font-size: 21px;
  font-weight: 700;
  text-decoration: none;
  letter-spacing: -.9px;
}

.brand > span:last-child {
  font-weight: 450;
  margin-left: -3px;
}

.logo {
  background: var(--blue);
  color: white;
  width: 34px;
  height: 36px;
  text-align: center;
  border-radius: 11px;
  font-size: 30px;
  line-height: 31px;
  margin-right: 3px;
}

.navlabel {
  font-size: 9px;
  letter-spacing: 1.8px;
  color: #a5acbb;
  margin: 57px 13px 16px;
}

nav button {
  border: 0;
  background: transparent;
  width: 100%;
  padding: 15px 16px;
  text-align: left;
  color: #8891a6;
  font-size: 20px;
  border-radius: 9px;
  margin: 4px 0;
  display: flex;
  align-items: center;
  gap: 14px;
}

nav span {
  font-size: 13px;
  font-weight: 550;
}

nav button.active {
  color: var(--blue);
  background: #edf2ff;
}

.sidebottom { margin-top: auto; }

.privacy {
  padding: 20px 15px;
  background: #f5f8ff;
  border-radius: 12px;
  color: var(--blue);
  font-size: 25px;
}

.privacy b {
  display: block;
  font-size: 12px;
  margin-top: 12px;
  color: #38435c;
}

.privacy p {
  font-size: 11px;
  line-height: 1.8;
  color: #929bad;
  margin-bottom: 0;
}

.user {
  display: flex;
  gap: 11px;
  align-items: center;
  border-top: 1px solid var(--line);
  padding: 24px 2px 0;
  margin-top: 25px;
  font-size: 11px;
}

.user > span,
.avatar {
  border-radius: 50%;
  background: #e7eefc;
  color: #4965a4;
  display: grid;
  place-items: center;
  width: 35px;
  height: 35px;
}

.user small {
  display: block;
  font-size: 9px;
  margin-top: 5px;
  color: var(--muted);
}

.shell { margin-left: 232px; }

header {
  height: 83px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 43px;
  font-size: 11px;
  color: #959bae;
}

header i {
  margin: 0 15px;
  font-style: normal;
  color: #d1d6e0;
}

header b {
  font-weight: 500;
  color: #4c5870;
}

.header-right {
  display: flex;
  gap: 24px;
  align-items: center;
}

.saved {
  font-size: 10px;
  color: #84958f;
}

.saved:first-letter { color: var(--green); }

main {
  max-width: 1510px;
  margin: auto;
  padding: 38px 43px 20px;
}

.heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.eyebrow {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--green);
  font-weight: 700;
}

h1 {
  font-size: 30px;
  letter-spacing: -1.2px;
  margin: 10px 0;
}

p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin: 0;
}

.primary {
  background: var(--blue);
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 13px 18px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: 0 5px 10px #2c51e815;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 30px 0 19px;
}

.tabs {
  display: flex;
  background: #eaf0f7;
  border-radius: 7px;
  padding: 4px;
}

.tabs button {
  background: transparent;
  border: 0;
  color: #8a93a6;
  padding: 8px 17px;
  border-radius: 5px;
  font-size: 11px;
}

.tabs button.active {
  background: #fff;
  color: var(--ink);
  box-shadow: 0 2px 5px #23334a09;
}

.dates {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-left: 8px;
  font-size: 12px;
}

.dates button {
  border: 0;
  background: transparent;
  color: #919bb1;
  font-size: 21px;
  padding: 0 8px;
}

.outline {
  margin-left: auto;
  background: white;
  border: 1px solid #e0e5ee;
  padding: 10px 15px;
  border-radius: 7px;
  color: #57657e;
  font-size: 11px;
}

.stats {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

.stats article {
  padding: 24px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 13px;
}

.stats .balance {
  background: var(--blue);
  color: white;
  border: 0;
  position: relative;
  overflow: hidden;
}

.balance:after {
  content: '';
  position: absolute;
  width: 180px;
  height: 180px;
  border: 28px solid #ffffff07;
  border-radius: 50%;
  right: -75px;
  top: -65px;
  pointer-events: none;
}

.card-label {
  font-size: 11px;
  display: flex;
  gap: 9px;
  align-items: center;
  color: #8a94a8;
}

.balance .card-label {
  color: #cdd8ff;
  justify-content: space-between;
}

.stats h2 {
  font-size: 29px;
  letter-spacing: -1px;
  font-weight: 600;
  margin: 19px 0 18px;
  white-space: nowrap;
}

.balance-foot {
  font-size: 9px;
  color: #becbff;
  display: flex;
  justify-content: space-between;
}

.balance-foot span { color: #b6fcde; }
.stats p { font-size: 10px; }

.dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 5px;
}

.green-bg { background: var(--green); }
.blue-bg { background: var(--blue); }

.metric-icon {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 17px;
}

.green {
  background: #e5f8f0;
  color: var(--green);
}

.blue {
  background: #edf1ff;
  color: var(--blue);
}

.charts {
  display: grid;
  grid-template-columns: 1.65fr 1fr;
  gap: 23px;
  margin-bottom: 24px;
}

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 24px;
}

.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

h3 {
  font-size: 14px;
  font-weight: 650;
  margin: 0 0 6px;
  letter-spacing: -.25px;
}

.panel-title p { font-size: 10px; }

.legend {
  display: flex;
  gap: 12px;
  font-size: 8px;
  color: var(--green);
  white-space: nowrap;
}

.legend span:last-child { color: var(--blue); }

#chart {
  height: 244px;
  margin-top: 22px;
}

#chart svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.donut-wrap {
  display: flex;
  justify-content: center;
  padding: 23px 0 18px;
}

.donut {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}

.donut > div {
  background: white;
  width: 118px;
  height: 118px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.donut small {
  font-size: 8px;
  color: var(--muted);
}

.donut b {
  font-size: 16px;
  letter-spacing: -.4px;
}

.catrow {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  margin: 10px 0;
  color: #727e95;
}

.catrow b {
  color: #3d4962;
  font-size: 10px;
  font-weight: 500;
}

.catrow .dot { margin-right: 7px; }

.textbutton {
  border: 0;
  background: transparent;
  color: var(--blue);
  font-size: 10px;
  padding: 0;
}

.filters {
  display: flex;
  gap: 10px;
  margin: 23px 0 16px;
}

.filters input {
  margin-right: auto;
  width: 230px;
}

input, select {
  border: 1px solid #e7ebf2;
  border-radius: 7px;
  background: #fff;
  padding: 10px 12px;
  color: #546078;
  font-size: 11px;
  outline-color: #8cacfa;
}

.filters select { min-width: 130px; }
input::placeholder { color: #a0a8b9; }
.tablewrap { overflow: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
}

th {
  font-size: 8px;
  letter-spacing: 1px;
  font-weight: 500;
  color: #98a1b3;
  text-align: left;
  background: #f9fafc;
  padding: 13px 12px;
}

td {
  padding: 15px 12px;
  border-bottom: 1px solid #f0f3f7;
  font-size: 10px;
  color: #8690a3;
}

td:first-child {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #35415a;
  font-weight: 550;
}

.txicon {
  width: 33px;
  height: 33px;
  border-radius: 10px;
  background: #f1f4fc;
  color: #687fba;
  display: grid;
  place-items: center;
  font-size: 16px;
}

.txname small {
  display: block;
  font-size: 9px;
  color: #a4adbd;
  font-weight: 400;
  margin-top: 4px;
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.badge {
  background: #f5f7fb;
  padding: 5px 9px;
  border-radius: 5px;
  font-size: 9px;
  color: #75829a;
}

.right { text-align: right; }

.amount {
  font-weight: 600;
  font-size: 11px;
  color: #35415a;
}

.amount.income { color: #15a47a; }

.rowactions button {
  border: 0;
  background: none;
  color: #97a3bc;
  padding: 4px;
  font-size: 12px;
}

.tablefooter {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: #a1aaba;
  margin-top: 17px;
}

footer {
  display: flex;
  gap: 18px;
  align-items: center;
  color: #a6aebe;
  font-size: 9px;
  padding: 25px 0 0;
}

footer b {
  font-size: 10px;
  color: #8f99ad;
}

footer span:last-child { margin-left: auto; }

dialog {
  border: 0;
  border-radius: 18px;
  padding: 28px;
  width: min(460px, calc(100% - 28px));
  box-shadow: 0 20px 100px #172a5a30;
  color: var(--ink);
}

dialog::backdrop {
  background: #15244765;
  backdrop-filter: blur(4px);
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-head small {
  font-size: 9px;
  color: var(--green);
  letter-spacing: 1.5px;
}

.modal-head h2 {
  font-size: 23px;
  margin: 8px 0;
}

.modal-head button {
  background: none;
  border: 0;
  font-size: 28px;
  color: #8e98ac;
}

label {
  display: block;
  font-size: 11px;
  margin-bottom: 15px;
  color: #67748e;
}

label input,
label select {
  width: 100%;
  margin-top: 7px;
  padding: 12px;
}

.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.submit {
  width: 100%;
  margin-top: 16px;
}

.localnote { font-size: 10px; }

#formError {
  color: #ce5264;
  font-size: 11px;
  margin-top: 8px;
}

#loginError {
  color: #bd4455;
  font-size: 12px;
  margin-top: 12px;
}

#loginModal {
  max-height: 90vh;
  overflow: auto;
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a3056;
  color: white;
  border-radius: 9px;
  padding: 13px 25px;
  font-size: 12px;
  display: none;
  z-index: 20;
}

.empty {
  text-align: center !important;
  padding: 40px;
  color: #8795ad;
  display: table-cell !important;
}

.hidden { display: none !important; }

.sheet-storage {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border: 1px solid #dce8ee;
  background: #f0faf7;
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 22px;
}

.sheet-storage b {
  font-size: 12px;
  color: #267560;
}

.sheet-storage p {
  font-size: 11px;
  margin-top: 7px;
  color: #506f63;
}

.sheet-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  flex-shrink: 0;
}

.sheet-actions .outline { margin: 0; }
.sheet-actions [hidden] { display: none; }

@media (min-width: 1450px) {
  main { padding-top: 48px; }
  .stats article { padding: 28px; }
  .stats h2 { font-size: 34px; }
  #chart { height: 265px; }
  .donut-wrap { padding-top: 30px; }
}

@media (max-width: 1100px) {
  aside {
    width: 195px;
    padding: 30px 15px;
  }

  .shell { margin-left: 195px; }
  main { padding: 30px 25px; }
  header { padding: 0 25px; }
  .stats h2 { font-size: 23px; }

  .charts {
    grid-template-columns: 1.4fr 1fr;
  }

  .legend {
    flex-direction: column;
    gap: 5px;
  }

  .panel { padding: 20px; }
  .stats { gap: 12px; }
  .stats article { padding: 20px; }

  .sheet-storage {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (max-width: 780px) {
  aside {
    width: 100%;
    height: 66px;
    inset: auto 0 0;
    z-index: 5;
    padding: 5px;
    background: #fff;
    border-top: 1px solid var(--line);
  }

  aside .brand,
  .navlabel,
  .sidebottom {
    display: none;
  }

  nav {
    display: flex;
    justify-content: space-around;
  }

  nav button {
    width: auto;
    flex-direction: column;
    gap: 1px;
    padding: 5px 20px;
    margin: 0;
    font-size: 19px;
  }

  nav span { font-size: 9px; }
  .shell { margin-left: 0; }

  header {
    height: 62px;
    padding: 0 20px;
  }

  main { padding: 28px 19px 90px; }

  .heading {
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 18px;
  }

  h1 { font-size: 28px; }

  .heading .primary {
    padding: 11px 15px;
  }

  .toolbar {
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 22px;
  }

  .dates {
    margin-left: auto;
    gap: 1px;
    font-size: 11px;
  }

  .outline { margin-left: 0; }

  .stats {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stats .balance { grid-column: 1 / -1; }
  .stats article { padding: 19px; }
  .stats h2 { font-size: 22px; }

  .stats .balance h2 {
    font-size: 34px;
    margin: 20px 0;
  }

  .card-label { font-size: 10px; }

  .charts {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .legend { flex-direction: row; }

  .categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .categories .panel-title {
    grid-column: 1 / -1;
  }

  .donut-wrap { padding: 20px 0 0; }

  .donut {
    width: 130px;
    height: 130px;
  }

  .donut > div {
    width: 104px;
    height: 104px;
  }

  .donut b { font-size: 13px; }

  #categories {
    align-self: center;
    padding-left: 10px;
  }

  .catrow {
    font-size: 9px;
    gap: 7px;
    flex-wrap: wrap;
  }

  .catrow b { font-size: 9px; }
  .transactions { padding: 18px 14px; }

  .transactions .panel-title {
    align-items: flex-start;
  }

  .textbutton {
    line-height: 1.6;
    text-align: right;
    max-width: 100px;
  }

  .filters {
    flex-wrap: wrap;
    gap: 7px;
  }

  .filters input {
    width: 100%;
    margin: 0;
  }

  .filters select {
    flex: 1;
    min-width: 0;
  }

  td, th {
    padding-left: 7px;
    padding-right: 7px;
  }

  td:nth-child(2),
  th:nth-child(2) {
    display: none;
  }

  .txicon {
    width: 28px;
    height: 28px;
  }

  .txname {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rowactions { white-space: nowrap; }
  .tablefooter { font-size: 8px; }
  footer { justify-content: center; }
  footer span { display: none; }
  .saved { font-size: 9px; }
  .header-right { gap: 14px; }
}
</style>
